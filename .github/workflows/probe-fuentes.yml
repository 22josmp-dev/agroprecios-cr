# Prueba manual: ¿el portal del PIMA responde a los servidores de GitHub Actions?
# Ejecutar desde la pestaña Actions -> "Prueba de fuentes PIMA" -> Run workflow.
name: Prueba de fuentes PIMA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar boletín e índice de prueba
        run: python scripts/probe_fuentes.py "$RUNNER_TEMP/pima"
