# Pruebas del motor de ingesta y de la app en cada cambio de código.
name: Pruebas

on:
  push:
    paths: ["ingesta/**", "tests/**", "app/**", "requirements*.txt", ".github/workflows/pruebas.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
